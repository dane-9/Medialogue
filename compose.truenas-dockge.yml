# Medialogue — TrueNAS SCALE + Dockge deployment
#
# IMPORTANT:
# - Do NOT put passwords or secret keys in this file.
# - Put the real values in Dockge's local .env editor on TrueNAS.
# - The repository copy of this file is safe to upload to GitHub.

services:
  medialogue:
    image: ghcr.io/${GITHUB_USERNAME:?Set GITHUB_USERNAME in Dockge .env}/medialogue:${MEDIALOGUE_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${MEDIALOGUE_PORT:-8000}:8000"
    environment:
      PUID: "${PUID:-568}"
      PGID: "${PGID:-568}"
      TZ: "${TZ:-UTC}"

      MEDIALOGUE_ENVIRONMENT: production
      MEDIALOGUE_DATABASE_URL: sqlite+aiosqlite:////config/medialogue.db
      MEDIALOGUE_CONFIG_DIR: /config
      MEDIALOGUE_TORRENT_ARCHIVE_DIR: /torrent-archive
      MEDIALOGUE_RECOVERY_EXPORT_DIR: /config/recovery-exports
      MEDIALOGUE_RECOVERY_EXPORT_RETENTION_HOURS: "1"
      # Optional override. If omitted, the application creates /config/application-secret.
      MEDIALOGUE_SECRET_KEY: "${MEDIALOGUE_SECRET_KEY:-}"
      MEDIALOGUE_LOG_LEVEL: INFO
      MEDIALOGUE_COOKIE_SECURE: "false"

    volumes:
      - ${CONFIG_HOST_PATH:?Set CONFIG_HOST_PATH in Dockge .env}:/config
      - ${TORRENT_ARCHIVE_HOST_PATH:?Set TORRENT_ARCHIVE_HOST_PATH in Dockge .env}:/torrent-archive

      # Existing media. Read-only is deliberate for the first deployment.
      - ${MOVIES_HOST_PATH:?Set MOVIES_HOST_PATH in Dockge .env}:/media/movies:ro
      - ${SHOWS_HOST_PATH:?Set SHOWS_HOST_PATH in Dockge .env}:/media/shows:ro

    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
