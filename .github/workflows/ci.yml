name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install backend and test dependencies
        run: |
          python -m pip install -r backend/requirements.lock
          python -m pip install --no-deps -e './backend'
      - name: Compile backend
        working-directory: backend
        run: python -m compileall -q app tests
      - name: Lint backend
        working-directory: backend
        run: |
          python -m pip install ruff==0.17.4
          python -m ruff check app tests
      - name: Verify OpenAPI contract snapshot
        run: python scripts/generate_api_contract.py --check
      - name: Run fast regression suite
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Frontend behavior tests
        run: npm test
      - name: Typecheck and production build
        run: npm run build

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare release-smoke environment
        run: |
          cp .env.example .env
          mkdir -p .ci-media .local/config .local/torrent-archive
      - name: Validate Compose configuration
        run: docker compose config -q
      - name: Build production image
        run: docker compose build media-manager
      - name: Verify UID 0 compatibility guard
        run: |
          if docker run --rm --entrypoint /usr/local/bin/medialogue-entrypoint -e PUID=0 -e MEDIALOGUE_ENTRYPOINT_CHECK_ONLY=1 medialogue:local; then
            echo "UID 0 was accepted without the compatibility override"
            exit 1
          fi
          docker run --rm --entrypoint /usr/local/bin/medialogue-entrypoint -e PUID=0 -e MEDIALOGUE_ALLOW_ROOT=true -e MEDIALOGUE_ENTRYPOINT_CHECK_ONLY=1 medialogue:local
      - name: Verify packaged runtime tools
        run: |
          docker run --rm --entrypoint /bin/sh medialogue:local -ec \
            "test -x /usr/local/bin/medialogue-entrypoint && python -c 'import alembic; from alembic.config import main; print(alembic.__version__)' && alembic --version"
      - name: Boot fresh release stack with the default non-root identity
        env:
          PUID: "10001"
          PGID: "10001"
        run: docker compose up -d
      - name: Wait for application readiness
        run: |
          timeout 180 bash -c 'until curl -fsS http://127.0.0.1:8000/readyz >/dev/null; do sleep 3; done'
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS http://127.0.0.1:8000/readyz
      - name: Verify generated application secret survives restart
        run: |
          test -s .local/config/application-secret
          test "$(stat -c '%a' .local/config/application-secret)" = "600"
          before="$(sha256sum .local/config/application-secret | cut -d' ' -f1)"
          docker compose restart media-manager
          timeout 180 bash -c 'until curl -fsS http://127.0.0.1:8000/readyz >/dev/null; do sleep 3; done'
          after="$(sha256sum .local/config/application-secret | cut -d' ' -f1)"
          test "$before" = "$after"
      - name: Show container state
        if: always()
        run: docker compose ps && docker compose logs --no-color --tail=150
      - name: Stop release stack
        if: always()
        run: docker compose down -v
