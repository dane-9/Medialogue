name: Publish GHCR Image (manual)

# This workflow NEVER runs on push, pull request, schedule, or tag creation.
# It runs only after you explicitly click "Run workflow" in GitHub Actions.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (normally: latest)'
        required: true
        default: 'latest'
        type: string
      confirm:
        description: 'Type PUBLISH to confirm that you want to push an image'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: ${{ inputs.confirm == 'PUBLISH' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute lowercase GHCR image name
        id: image
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Medialogue
            org.opencontainers.image.description=Leave-in-place media inventory and download manager
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # Build locally first. Nothing is pushed until the resulting image passes
      # the same runtime checks needed by the real container entrypoint.
      - name: Build image for pre-publish validation
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate image before publishing
        run: |
          docker run --rm --entrypoint /bin/sh "${{ steps.image.outputs.image }}:${{ inputs.tag }}" -ec '
            test -x /usr/local/bin/medialogue-entrypoint
            python -c "import alembic; from alembic.config import main; print(alembic.__version__)"
            alembic --version
            cd /app/backend
            test "$(find alembic/versions -maxdepth 1 -type f -name "*.py" ! -name "__init__.py" | wc -l)" -eq 1
            test "$(alembic heads | grep -c "(head)")" -eq 1
            alembic heads | grep -q "^0001 (head)$"
          '

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push validated image tags
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r image_tag; do
            [ -n "$image_tag" ] && docker push "$image_tag"
          done <<EOF
          $IMAGE_TAGS
          EOF
