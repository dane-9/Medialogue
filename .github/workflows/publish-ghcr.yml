name: Publish GHCR Image (manual)

# This workflow NEVER runs on push, pull request, schedule, or tag creation.
# It runs only after you explicitly click "Run workflow" in GitHub Actions.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (normally: latest)'
        required: true
        default: 'latest'
        type: string
      confirm:
        description: 'Type PUBLISH to confirm that you want to push an image'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: ${{ inputs.confirm == 'PUBLISH' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Medialogue
            org.opencontainers.image.description=Leave-in-place media inventory and download manager
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
