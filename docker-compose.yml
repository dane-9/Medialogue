services:
  media-manager:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${MEDIALOGUE_VERSION:-0.1.0}
    image: ${MEDIALOGUE_IMAGE:-medialogue:local}
    restart: unless-stopped
    ports:
      - "${MEDIA_MANAGER_PORT:-8000}:8000"
    environment:
      PUID: ${PUID:-10001}
      PGID: ${PGID:-10001}
      TZ: ${TZ:-UTC}
      MEDIALOGUE_ENVIRONMENT: production
      MEDIALOGUE_DATABASE_URL: sqlite+aiosqlite:////config/medialogue.db
      MEDIALOGUE_CONFIG_DIR: /config
      MEDIALOGUE_TORRENT_ARCHIVE_DIR: /torrent-archive
      MEDIALOGUE_GOOGLE_DRIVE_CLIENT_ID: ${MEDIALOGUE_GOOGLE_DRIVE_CLIENT_ID:-}
      MEDIALOGUE_GOOGLE_DRIVE_CLIENT_SECRET: ${MEDIALOGUE_GOOGLE_DRIVE_CLIENT_SECRET:-}
      MEDIALOGUE_GOOGLE_DRIVE_REDIRECT_URI: ${MEDIALOGUE_GOOGLE_DRIVE_REDIRECT_URI:-}
      # Optional override. If omitted, the application creates /config/application-secret.
      MEDIALOGUE_SECRET_KEY: ${MEDIALOGUE_SECRET_KEY:-}
      MEDIALOGUE_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MEDIALOGUE_COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - ${CONFIG_DIR:-./.local/config}:/config
      - ${TORRENT_ARCHIVE_DIR:-./.local/torrent-archive}:/torrent-archive
      # Add only media paths Medialogue may inspect. Read-only is the safe default.
      # Change a specific bind to :rw only if explicit GUI deletion is desired.
      - ${MEDIA_DIR:-./media}:/media:ro
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
